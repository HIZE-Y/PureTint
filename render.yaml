services:
  - type: web
    name: puretint-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npx pnpm@11.0.9 install --frozen-lockfile && npx pnpm@11.0.9 prisma:generate && npx pnpm@11.0.9 build
    startCommand: npx pnpm@11.0.9 start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
